name = "fortran_gpt"
version = "0.1.0"
license = "MIT"
author = "Ian Giestas Pauli"
maintainer = "iangiestas@usp.br"
copyright = "Copyright 2026, Ian Giestas Pauli"
homepage = "https://github.com/14NGiestas/autoresearch"
description = "Pure-Fortran GPT for CPU: forward/backward, training loop, KV/generation, safetensors checkpoints, and self-measured energy/CPU/IO per phase"
keywords = ["gpt", "transformer", "language-model", "inference", "training", "safetensors", "energy"]
categories = ["machine-learning", "linear-algebra", "io", "numerical"]

[library]
source-dir = "lib"

# cpp nos nossos .f90: e' o que permite escolher a ARCH NA INVOCACAO, sem editar
# fonte (ver [features] abaixo e bin/build_arch). Sem macro definida, valem os
# #ifndef ARCH_* do fortran_arch.f90 (a config canonica do repo).
[preprocess]
cpp.suffixes = ["f90"]

# Uma linha por arch EM USO. O nome da feature e' o DESCRITOR completo (tem de
# bater com o que bin/build_arch pedir, senao o script cai no --flag -D e avisa).
# Isto e' documentacao + ergonomia, nao a verdade: a verdade e' o que foi
# compilado, e o binario se identifica sozinho (arch_id deriva dos parametros).
[features]
# GPU: o caminho rocBLAS do BLAS. O arquivo e' src/lib/gpu_shim.cpp, e ele
# compila nos DOIS casos, porque o caminho GPU esta' sob a macro ARCH_GPU e o
# outro ramo e' C++ puro. Por isso ele pode viver dentro do pacote, e o build
# CPU-only (e o fpm test) nao precisa de ROCm.
#
# Aqui fica o que NAO depende da maquina: a macro e o NOME da biblioteca. Os
# caminhos de include e de link vem do ambiente, porque sao caminhos do nix
# store, e caminho de store dentro do repositorio envelhece. bin/build_gpu os monta.
gpu.flags = "-O2"
gpu.preprocess.cpp.macros = ["ARCH_GPU"]
arch_d96_h6_kv2_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=96", "ARCH_N_HEAD=6", "ARCH_N_KV=2", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d96_h6_kv1_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=96", "ARCH_N_HEAD=6", "ARCH_N_KV=1", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d96_h3_kv1_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=96", "ARCH_N_HEAD=3", "ARCH_N_KV=1", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d96_h2_kv1_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=96", "ARCH_N_HEAD=2", "ARCH_N_KV=1", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d512_h8_kv2_l13_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=512", "ARCH_N_HEAD=8", "ARCH_N_KV=2", "ARCH_N_LAYER=13",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d768_h6_kv2_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=768", "ARCH_N_HEAD=6", "ARCH_N_KV=2", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
arch_d216_h6_kv2_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=216", "ARCH_N_HEAD=6", "ARCH_N_KV=2", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }
# d360 com o head_dim CONTROLADO: 360/10 = 36, o mesmo head_dim do d216. Este
# ponto separa o efeito de ESCALA do efeito de FORMA no ganho d216 -> d360.
arch_d360_h10_kv2_l12_v8192_c1024 = { flags = "-O2", preprocess = { cpp = { macros = [
  "ARCH_D_MODEL=360", "ARCH_N_HEAD=10", "ARCH_N_KV=2", "ARCH_N_LAYER=12",
  "ARCH_VOCAB=8192", "ARCH_CTX=1024", "ARCH_BOS=8188"] } } }

[dependencies]
openmp = "*"
stdlib = "*"
safetensors = { git = "https://github.com/14NGiestas/safetensors-fortran", tag = "v0.1.3" }
# Energia/CPU/IO medidos pelo PROPRIO processo (fortran_energy, pacote separado
# em energy-fortran/). path por enquanto: vira `git = ...` quando for publicado.
fortran_energy = { path = "../energy-fortran" }
# NOTE: mfi (14NGiestas/mfi, branch mfi-fpm) was tried 2026-09-07 and
# reverted the same day: its BLAS interfaces are LP64 (default integer)
# but nixpkgs OpenBLAS is ILP64 (USE64BITINT) -> SIGFPE in gemm_driver.
# See src/lib/fortran_blas.f90 header. Do not re-add without ILP64 BLAS.
# M_CLI2 (parser de CLI) como DEPENDENCIA, nao vendado. A nota antiga dizia
# que "fpm 0.10.1 ignora os .F90 da dependencia" -- isso e' FALSO no fpm do
# nix: testado 2026-09-18 com um pacote minimo, `M_CLI2 = {git=...}` compila e
# roda (src/M_CLI2.F90 e' pre-processado normalmente). Pinado por COMMIT porque
# a tag V3.2.0 difere em 1109 linhas do arquivo que estava vendado; este sha
# tem src/M_CLI2.F90 IDENTICO ao vendado (caixa a parte), verificado com diff.
M_CLI2 = { git = "https://github.com/urbanjost/M_CLI2", rev = "0704ed34c800f5d153cd192dedc0052c53ec9589" }

[build]
link = ["openblas"]

# Perfis: `debug` (default) e `release` sao EMBUTIDOS do fpm -- nao redefinir.
# Nao ha perfil de "warnings extras": o fpm 0.13 usa `[features]` para inclusao
# condicional de fonte (estilo Cargo), nao para flags de compilador, e a nota
# antiga ("[profiles] so' aceita nome de feature do compilador") valia para fpm
# anterior. O gate estrito (com -Werror e valendo SO' no nosso codigo) e':
#
#   bin/fstrict                          # -Wall -Wextra -fcheck=all -Werror
#   fortran-fpm build --build-dir /tmp/B  # build normal (deps + nos)
#   fortran-fpm test  --build-dir /tmp/B  # suite completa
#
# (Nao ha bloco [profiles] de proposito: um perfil com nome de feature do
# compilador e' rejeitado por esta versao do fpm.)
