[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
# torch NAO entra aqui. Este repo e' torch-free: o treino e' Fortran puro, e os
# scripts usam numpy/pyarrow/tiktoken/matplotlib. O torch vinha do fork de
# origem e fazia qualquer `uv run` que resolvesse o projeto baixar GBs de CUDA,
# alem de trocar o .venv da raiz. Se uma ferramenta especifica precisa de torch,
# ela declara isso no ambiente dela, nao no do repo.
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
]
