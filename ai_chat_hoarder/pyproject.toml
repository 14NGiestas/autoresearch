[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-hoarder"
version = "0.1.0"
description = "Discover and archive publicly-shared AI chat conversations across platforms."
requires-python = ">=3.9"
dependencies = ["ddgs"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-hoarder = "ai_chat_hoarder.cli:main"

[tool.setuptools]
packages = ["ai_chat_hoarder", "ai_chat_hoarder.platforms", "ai_chat_hoarder.discover"]
